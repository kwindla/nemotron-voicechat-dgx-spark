[project]
name = "nemotron-voicechat-dgx-spark"
version = "0.1.0"
description = "Strict-v3 Nemotron Voicechat runtime and Pipecat SmallWebRTC demo for DGX Spark"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
dependencies = [
    "av==17.1.0",
    "fastapi==0.141.1",
    "huggingface-hub==0.34.4",
    "numpy==2.4.6",
    "pipecat-ai[runner,webrtc] @ git+https://github.com/pipecat-ai/pipecat.git@5415f28af9407937610d68abb2c195365650a862",
    "regex==2026.7.19",
    "uvicorn[standard]==0.52.1",
    "websockets==17.0.1",
]

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "soundfile==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_voicechat_runtime", "src/nemotron_voicechat_pipecat"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser_e2e: requires Chromium and a live Pipecat endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]
