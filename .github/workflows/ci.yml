name: source-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version-file: .python-version

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.21

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Run source and protocol contracts
        run: ./voicechat test

      - name: Run lint
        run: uv run --frozen ruff check .
